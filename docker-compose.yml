services:
  postgres:
    image: postgres:16-alpine
    container_name: nutrigon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nutrigon
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nutrigon']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nutrigon-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nutrigon-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nutrigon
      JWT_SECRET: ${JWT_SECRET:-nutrigon_default_development_secret_key_12345}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,https://nutrigon.pages.dev}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-nutrigon-media}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-https://media.nutrigon.com}
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nutrigon-network

networks:
  nutrigon-network:
    driver: bridge

volumes:
  postgres_data:
